services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shortlink
      POSTGRES_USER: shortlink
      POSTGRES_PASSWORD: shortlink
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run build --workspace backend && npm start --workspace backend"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://shortlink:shortlink@postgres:5432/shortlink
      STORAGE_MODE: postgres
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
      PUBLIC_URL: http://go.linkloom.localhost:3000
    ports: ["3000:3000"]
    volumes: [".:/app"]
    depends_on: [postgres, redis]

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev --workspace frontend -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:3000
    ports: ["5173:5173"]
    volumes: [".:/app"]
    depends_on: [backend]

volumes:
  postgres_data:
