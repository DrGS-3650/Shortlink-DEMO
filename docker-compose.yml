services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shortlink
      POSTGRES_USER: shortlink
      POSTGRES_PASSWORD: shortlink
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortlink -d shortlink"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run build --workspace backend && npm start --workspace backend"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://shortlink:shortlink@postgres:5432/shortlink
      STORAGE_MODE: postgres
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
      PUBLIC_URL: http://go.linkloom.localhost:3000
    ports: ["3000:3000"]
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev --workspace frontend -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:3000
    ports: ["5173:5173"]
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
